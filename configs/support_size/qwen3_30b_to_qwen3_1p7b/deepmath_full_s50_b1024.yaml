  TRAIN_BATCH_SIZE: '1024'
  MAX_PROMPT_LENGTH: '2048'
  MAX_RESPONSE_LENGTH: '16384'
  TRAINING_SEED: '42'
  OPD_ENABLE_THINKING: 'False'
  STUDENT_MODEL: ${MODEL_ROOT}/qwen3_1p7b
  STUDENT_TOKENIZER: ${MODEL_ROOT}/qwen3_1p7b
