  VAL_N: '4'
  ROLLOUT_IS: token
  ROLLOUT_IS_THRESHOLD: '5.0'
  ROLLOUT_IS_BATCH_NORMALIZE: 'False'
  ROLLOUT_BYPASS_MODE: 'False'
  DISTILLATION_ENABLE_RESOURCE_POOL: 'True'
  TEACHER_GPUS_PER_NODE: '8'
  TEACHER_NNODES: '1'
