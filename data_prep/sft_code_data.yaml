schema_version: code_sft_v2.0
seed: 20260717
total_samples: 80000
val_samples: 512
max_seq_len: 4096
tokenizer_path: ${MODEL_ROOT}/qwen3_1p7b_base_chat
out_sft_dir: ${OUTPUT_ROOT}/sft_code_data

# V2 pilot deliberately trains direct code output only. It does not supervise
# <think>, </think>, /think, /no_think, explanations, or multiple code blocks.
function_instruction: >-
  Complete the requested Python function. Preserve the required function or
  class interface exactly. Return only the final implementation inside one
  ```python code block.
competitive_instruction: >-
  Solve the programming problem in Python. Preserve any required starter-code
  interface. Return only the complete final program inside one ```python code
  block.

